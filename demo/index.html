<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>maplibre-elevation-control demo</title>
    <style>
      html,
      body {
        padding: 0;
        margin: 0;
        width: 100%;
        height: 100%;
      }
      #map {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script type="module">
      import { Map, config } from "maplibre-gl";
      import "maplibre-gl/dist/maplibre-gl.css";
      import "../src/style.css";
      import { ElevationControl } from "../src/index.ts";
      import geojson from "./example.geojson?raw";

      if (import.meta.env.PROD) {
        config.WORKER_URL = new URL("./maplibre-gl-worker.mjs", import.meta.url).href;
      }

      const map = new Map({
        container: "map",
        style: "https://styles.maptoolkit.org/summer.json",
        bounds: [13.672, 47.327, 13.759, 47.384],
        attributionControl: { customAttribution: "", compact: false },
      });

      const ctrl = new ElevationControl(JSON.parse(geojson));
      map.addControl(ctrl);
    </script>
  </body>
</html>
